<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoodSpace GH</title>
<style>
body{margin:0;font-family:Arial;background:#f0f6ff}
header{background:#2563eb;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:22px}
.wrap{max-width:650px;margin:16px auto;padding:0 12px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:7px 0;font-size:15px;box-sizing:border-box}
.btn{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:12px;width:100%;font-weight:bold;font-size:16px;cursor:pointer}
.btn2{background:#e0eaff;color:#2563eb;border:0;border-radius:10px;padding:12px;width:100%;font-weight:bold;margin-top:8px;cursor:pointer}
.small{font-size:13px;color:#64748b;text-align:center}
.hidden{display:none}
.badge{background:#dbeafe;color:#1d4ed8;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:bold}
.post-img{width:100%;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<header><b>MoodSpace GH</b><span id="headerUser"></span></header>

<div class="wrap" id="authScreen">
<div class="card" style="text-align:center">
<h2 style="color:#2563eb;margin:4px 0">Welcome to MoodSpace GH</h2>
<p class="small">Blue and White. Post Announcements, Promos, Events.</p>
<input id="authName" placeholder="Full Name (for Create Account)">
<input id="authEmail" placeholder="Email">
<input id="authPass" placeholder="Password" type="password">
<p id="authMsg" style="color:red"></p>
<button class="btn" onclick="doLogin()">Login</button>
<button class="btn2" onclick="doSignup()">Create Account</button>
<p><a href="#" onclick="doReset();return false;">Forgot Password?</a></p>
</div>
</div>

<div class="wrap hidden" id="mainScreen">
<div class="card">
<h3 style="margin:0;color:#2563eb">Create Post</h3>
<select id="postType"><option>Announcement</option><option>Promo</option><option>Event</option></select>
<input id="postTitle" placeholder="Title">
<textarea id="postText" rows="3" placeholder="Write details... date, venue, price, link"></textarea>
<input id="postImage" placeholder="Image link (optional)">
<button class="btn" onclick="doPost()">Post Now</button>
<p id="postMsg" class="small"></p>
</div>
<div id="feed"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

var firebaseConfig = {
  apiKey: "AIzaSyBHp8ica_4LhPVYYyxhQz70x7ad2x-cOJM",
  authDomain: "moodspaceafrica.firebaseapp.com",
  projectId: "moodspaceafrica",
  storageBucket: "moodspaceafrica.firebasestorage.app",
  messagingSenderId: "449390027692",
  appId: "1:449390027692:web:8651532b91c5ea3e82d009"
};
var app = initializeApp(firebaseConfig);
var auth = getAuth(app);
var db = getFirestore(app);
var currentUser = null;
var currentName = "User";
var allPosts = [];

function getEl(id){ return document.getElementById(id); }

window.doSignup = async function(){
  var name = getEl("authName").value;
  var email = getEl("authEmail").value;
  var pass = getEl("authPass").value;
  if(name === ""){ getEl("authMsg").textContent = "Enter your Name"; return; }
  if(email === "" || pass === ""){ getEl("authMsg").textContent = "Enter email and password"; return; }
  getEl("authMsg").textContent = "Creating...";
  try{
    var cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, {displayName: name});
    await setDoc(doc(db, "users", cred.user.uid), {name: name, email: email, createdAt: serverTimestamp()});
    getEl("authMsg").textContent = "";
  }catch(e){ getEl("authMsg").textContent = e.message; }
};

window.doLogin = async function(){
  var email = getEl("authEmail").value;
  var pass = getEl("authPass").value;
  if(email === "" || pass === ""){ getEl("authMsg").textContent = "Enter email and password"; return; }
  getEl("authMsg").textContent = "Logging in...";
  try{
    await signInWithEmailAndPassword(auth, email, pass);
    getEl("authMsg").textContent = "";
  }catch(e){ getEl("authMsg").textContent = e.message; }
};

window.doReset = async function(){
  var email = getEl("authEmail").value;
  if(email === ""){ alert("Type your email first"); return; }
  try{ await sendPasswordResetEmail(auth, email); alert("Reset email sent"); }catch(e){ alert(e.message); }
};

window.doLogout = async function(){ await signOut(auth); };

window.doPost = async function(){
  if(currentUser === null){ alert("Login first"); return; }
  var title = getEl("postTitle").value;
  var text = getEl("postText").value;
  var type = getEl("postType").value;
  var image = getEl("postImage").value;
  if(title === "" || text === ""){ getEl("postMsg").textContent = "Add Title and Details"; return; }
  getEl("postMsg").textContent = "Posting...";
  try{
    await addDoc(collection(db, "posts"), {title: title, text: text, type: type, image: image, authorName: currentName, authorId: currentUser.uid, createdAt: serverTimestamp()});
    getEl("postTitle").value = "";
    getEl("postText").value = "";
    getEl("postImage").value = "";
    getEl("postMsg").textContent = "Posted!";
  }catch(e){ getEl("postMsg").textContent = e.message; }
};

function showFeed(){
  var feed = getEl("feed");
  if(allPosts.length === 0){ feed.innerHTML = "<div class='card' style='text-align:center'>No posts yet. Be the first!</div>"; return; }
  var html = "";
  for(var i=0;i<allPosts.length;i++){
    var p = allPosts[i];
    var imgHtml = "";
    if(p.image && p.image !== ""){ imgHtml = "<img class='post-img' src='" + p.image + "'>"; }
    html = html + "<div class='card'><span class='badge'>" + p.type + "</span><h3>" + p.title + "</h3><p>" + p.text + "</p><p class='small'>By " + p.authorName + "</p>" + imgHtml + "</div>";
  }
  feed.innerHTML = html;
}

onAuthStateChanged(auth, async function(user){
  if(user){
    currentUser = user;
    currentName = user.displayName || "User";
    try{
      var snap = await getDoc(doc(db, "users", user.uid));
      if(snap.exists()){ currentName = snap.data().name; }
    }catch(e){}
    getEl("authScreen").classList.add("hidden");
    getEl("mainScreen").classList.remove("hidden");
    getEl("headerUser").innerHTML = "Hi, " + currentName + " <button onclick='doLogout()'>Logout</button>";
  } else {
    currentUser = null;
    getEl("authScreen").classList.remove("hidden");
    getEl("mainScreen").classList.add("hidden");
    getEl("headerUser").innerHTML = "";
  }
});

var q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
onSnapshot(q, function(snap){
  allPosts = [];
  snap.forEach(function(d){ var data = d.data(); data.id = d.id; allPosts.push(data); });
  if(currentUser !== null){ showFeed(); }
});
</script>
</body>
</html>
