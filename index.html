<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoodSpace Africa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#0f0f12;color:#fff;min-height:100vh}
header{position:sticky;top:0;background:#0f0f12cc;backdrop-filter:blur(10px);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;z-index:10}
.logo{font-weight:900;font-size:20px} .logo span{color:#ff5a8a}
button{border:0;cursor:pointer;border-radius:999px;padding:10px 16px;font-weight:700}
.btn-pink{background:#ff5a8a;color:#fff} .btn-ghost{background:#222;color:#fff} .btn-sm{padding:6px 12px;font-size:13px}
.wrap{max-width:560px;margin:0 auto;padding:16px;padding-bottom:90px}
.card{background:#1a1a20;border:1px solid #2a2a33;border-radius:18px;padding:16px;margin-bottom:14px}
input,textarea,select{width:100%;background:#111;padding:12px;border-radius:12px;border:1px solid #333;color:#fff;margin:8px 0;outline:none}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#333;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;margin-left:5px;font-weight:800}
.b-creator{background:#ff5a8a} .b-business{background:#00c2a8;color:#000} .b-admin{background:gold;color:#000}
.post-img{width:100%;border-radius:14px;margin-top:10px;max-height:380px;object-fit:cover}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hidden{display:none!important}
.tabs{display:flex;gap:8px;margin:12px 0;overflow:auto}
.tab{white-space:nowrap}
.tab.active{background:#fff;color:#000}
.topbar{display:flex;gap:8px;align-items:center}
small{color:#aaa}
.nav{position:fixed;bottom:0;left:0;right:0;background:#15151a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px}
.nav button{background:none;color:#aaa} .nav button.active{color:#ff5a8a}
</style>
</head>
<body>
<header><div class="logo">Mood<span>Space</span> Africa</div><div class="topbar"><span id="myName"></span><button class="btn-ghost btn-sm" onclick="showPage('profile')">Profile</button><button class="btn-ghost btn-sm hidden" id="logoutBtn" onclick="logout()">Logout</button></div></header>

<div class="wrap">
<div id="page-auth" class="card">
<h2>Welcome to MoodSpace 🇬🇭</h2><p><small>Post moods, photos, find creators & businesses near you.</small></p>
<input id="authName" placeholder="Your Name (for signup)">
<input id="authEmail" placeholder="Email" type="email">
<input id="authPass" placeholder="Password (6+ chars)" type="password">
<button class="btn-pink" style="width:100%" onclick="signup()">Create Account</button>
<button class="btn-ghost" style="width:100%;margin-top:8px" onclick="login()">Login</button>
<button class="btn-ghost" style="width:100%;margin-top:8px" onclick="resetPass()">Forgot Password? Send Reset Email</button>
<p id="authMsg"><small></small></p>
</div>

<div id="page-feed" class="hidden">
<div class="tabs">
<button class="tab active btn-ghost" onclick="setFilter('all',this)">All 🌍</button>
<button class="tab btn-ghost" onclick="setFilter('Creator',this)">Creators 🎨</button>
<button class="tab btn-ghost" onclick="setFilter('Business',this)">Businesses 🏪</button>
<button class="tab btn-ghost" onclick="setFilter('Mood',this)">Moods 💭</button>
</div>
<div class="card">
<div style="display:flex;gap:10px"><div class="avatar" id="composerAvatar">😊</div><textarea id="postText" rows="2" placeholder="How are you feeling today? Share a mood..."></textarea></div>
<input id="postImg" placeholder="Paste image link (optional) - e.g. https://...">
<select id="postCat"><option value="Mood">Mood 💭</option><option value="Creator">Creator Post 🎨</option><option value="Business">Business Post 🏪</option></select><button class="btn-pink" style="width:100%" onclick="createPost()">Post to Everyone →</button>
</div>
<div id="posts"></div>
</div>

<div id="page-profile" class="hidden">
<div class="card" style="text-align:center">
<div class="avatar" style="width:90px;height:90px;margin:0 auto;font-size:36px" id="profileAvatar">😊</div>
<h3 id="profileName" style="margin-top:10px">Your Name</h3><p id="profileEmail"><small></small></p>
<p id="profileBioText" style="margin:8px 0"></p>
<div id="profileBadges"></div>
</div>
<div class="card">
<h3>Edit Profile</h3>
<input id="editName" placeholder="Name">
<input id="editPhoto" placeholder="Profile photo link - paste image URL">
<textarea id="editBio" placeholder="Bio - e.g. Dancer in Accra | Bookings open"></textarea>
<select id="editType"><option value="User">Normal User</option><option value="Creator">Creator 🎨</option><option value="Business">Business 🏪</option></select>
<input id="editLocation" placeholder="Location - e.g. Accra, Osu">
<button class="btn-pink" style="width:100%" onclick="saveProfile()">Save Profile</button>
<button class="btn-ghost" style="width:100%;margin-top:8px" onclick="resetPass()">Send Me Password Reset Email</button>
</div>
</div>
</div>

<div class="nav">
<button class="active" onclick="showPage('feed',this)">🏠 Feed</button>
<button onclick="showPage('profile',this)">👤 Profile</button>
<button onclick="alert('Creators: post with Creator tag to get discovered. Businesses: post offers!')">✨ Discover</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,query,orderBy,onSnapshot,doc,setDoc,getDoc,updateDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyBHp8ica_4LhPVYYyxhQz70x7ad2x-cOJM",authDomain:"moodspaceafrica.firebaseapp.com",projectId:"moodspaceafrica",storageBucket:"moodspaceafrica.firebasestorage.app",messagingSenderId:"449390027692",appId:"1:449390027692:web:8651532b91c5ea3e82d009"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app); const db=getFirestore(app);
let me=null, myProfile={}, filter='all', allPosts=[];

window.showPage=(p,btn)=>{['feed','profile','auth'].forEach(x=>document.getElementById('page-'+x).classList.add('hidden'));document.getElementById('page-'+p).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');if(p==='profile')loadProfileForm();};
window.setFilter=(f,btn)=>{filter=f;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderPosts();};
window.signup=async()=>{const n=document.getElementById('authName').value,email=document.getElementById('authEmail').value,pass=document.getElementById('authPass').value;try{const c=await createUserWithEmailAndPassword(auth,email,pass);await setDoc(doc(db,"users",c.user.uid),{name:n||email.split('@')[0],email,bio:"",photo:"",type:"User",location:"Accra",createdAt:serverTimestamp()});}catch(e){document.getElementById('authMsg').innerText=e.message;}};
window.login=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById('authEmail').value,document.getElementById('authPass').value);}catch(e){document.getElementById('authMsg').innerText=e.message;}};
window.logout=async()=>{await signOut(auth);};
window.resetPass=async()=>{const em=document.getElementById('authEmail')?.value||me?.email;if(!em)return alert("Enter your email first");await sendPasswordResetEmail(auth,em);alert("Reset email sent to "+em+" - check inbox / spam");};
window.saveProfile=async()=>{if(!me)return;await updateDoc(doc(db,"users",me.uid),{name:document.getElementById('editName').value,photo:document.getElementById('editPhoto').value,bio:document.getElementById('editBio').value,type:document.getElementById('editType').value,location:document.getElementById('editLocation').value});alert("Saved!");showPage('feed');};
window.createPost=async()=>{const t=document.getElementById('postText').value;if(!t)return alert("Write something");await addDoc(collection(db,"posts"),{text:t,image:document.getElementById('postImg').value,category:document.getElementById('postCat').value,authorName:myProfile.name||me.email,authorPhoto:myProfile.photo||"",authorType:myProfile.type||"User",uid:me.uid,likes:[],createdAt:serverTimestamp()});document.getElementById('postText').value="";document.getElementById('postImg').value="";};
window.likePost=async(id,likes)=>{if(!me)return;let l=[...(likes||[])];if(l.includes(me.uid))l=l.filter(x=>x!==me.uid);else l.push(me.uid);await updateDoc(doc(db,"posts",id),{likes:l});};
window.deletePost=async(id)=>{if(confirm("Delete this post?"))await deleteDoc(doc(db,"posts",id));};

function loadProfileForm(){if(!myProfile)return;document.getElementById('editName').value=myProfile.name||"";document.getElementById('editPhoto').value=myProfile.photo||"";document.getElementById('editBio').value=myProfile.bio||"";document.getElementById('editType').value=myProfile.type||"User";document.getElementById('editLocation').value=myProfile.location||"";}

function renderPosts(){const box=document.getElementById('posts');box.innerHTML="";let list=allPosts.filter(p=>filter==='all'||p.category===filter);if(!list.length)box.innerHTML="<div class='card'><small>No posts yet in this category. Be the first!</small></div>";list.forEach(p=>{const isMine=me&&p.uid===me.uid;let badges="";if(p.authorType==='Creator')badges+='<span class="badge b-creator">Creator ✓</span>';if(p.authorType==='Business')badges+='<span class="badge b-business">Business ✓</span>';let del="";if(isMine)del=`<button class="btn-ghost btn-sm" onclick="deletePost('${p.id}')">Delete</button>`;let liked=p.likes?.includes(me?.uid)?"❤️":"🤍";box.innerHTML+=`<div class="card"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">${p.authorPhoto?`<img src="${p.authorPhoto}">`:"😊"}</div><div><b>${p.authorName||"User"}</b>${badges}<br><small>${p.category} • ${p.createdAt?.toDate?.().toLocaleString()||"Just now"}</small></div></div><p style="margin-top:10px;white-space:pre-wrap">${p.text||""}</p>${p.image?`<img class="post-img" src="${p.image}">`:""}<div class="actions"><button class="btn-ghost btn-sm" onclick="likePost('${p.id}',${JSON.stringify(p.likes||[])})">${liked} ${p.likes?.length||0}</button><button class="btn-ghost btn-sm" onclick="alert('Comments coming in v2 - for now like & share!')">💬 Comment</button>${del}</div></div>`;});}

onAuthStateChanged(auth,async(u)=>{me=u;if(!u){document.getElementById('page-auth').classList.remove('hidden');document.getElementById('page-feed').classList.add('hidden');document.getElementById('logoutBtn').classList.add('hidden');return;}
document.getElementById('page-auth').classList.add('hidden');document.getElementById('page-feed').classList.remove('hidden');document.getElementById('logoutBtn').classList.remove('hidden');
const snap=await getDoc(doc(db,"users",u.uid));if(snap.exists())myProfile=snap.data();else{myProfile={name:u.email.split('@')[0],email:u.email,type:"User",bio:"",photo:""};await setDoc(doc(db,"users",u.uid),myProfile,{merge:true});}
document.getElementById('myName').innerText="Hi, "+(myProfile.name||"");document.getElementById('profileName').innerText=myProfile.name||"";document.getElementById('profileEmail').innerText=u.email;document.getElementById('profileBioText').innerText=(myProfile.bio||"")+" • "+(myProfile.location||"");document.getElementById('profileAvatar').innerHTML=myProfile.photo?`<img src="${myProfile.photo}">`:"😊";document.getElementById('composerAvatar').innerHTML=myProfile.photo?`<img src="${myProfile.photo}">`:"😊";
let pb="";if(myProfile.type==='Creator')pb+='<span class="badge b-creator">Creator ✓</span>';if(myProfile.type==='Business')pb+='<span class="badge b-business">Business ✓</span>';document.getElementById('profileBadges').innerHTML=pb;
});

const q=query(collection(db,"posts"),orderBy("createdAt","desc"));
onSnapshot(q,(s)=>{allPosts=s.docs.map(d=>({id:d.id,...d.data()}));renderPosts();});
</script>
</body>
</html>
